name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # CI の機械は英語版 Windows。日本語を書き出したところで落ちないように
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存関係を入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyflakes

      - name: 構文を確かめる
        run: |
          python -m compileall -q koyomi
          python -m py_compile run.pyw

      - name: 未使用・未定義を確かめる
        run: python -m pyflakes koyomi run.pyw tools tests

      # 落ちたテストと時間のかかったテストは、注記として実行結果の画面に出る
      - name: 画面を組み立ててみる
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py -v

      - name: 対訳表の抜けと書式を確かめる
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_translations.py
